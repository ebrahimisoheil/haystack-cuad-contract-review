version: 2

service:
  name: haystack-cuad-contract-review
  description: Haystack and LiteLLM workflow for contract review against a fictional playbook.

telemetry:
  endpoint: http://localhost:24318
  mode: auto
  capture_content: false

default_contract: contract_review
default_workflow: contract-review

contracts:
  - contracts/contract-review.yaml

workflows:
  - workflows/contract-review.yaml
